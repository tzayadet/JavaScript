name: Static experiment checks

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "scripts/**"
      - ".github/workflows/static-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "*.html"
      - "scripts/**"
      - ".github/workflows/static-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate local page references and inline JavaScript
        run: python scripts/validate_pages.py
